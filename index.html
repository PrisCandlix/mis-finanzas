<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Finanzas</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Merriweather', 'Playfair Display', 'serif'],
                    },
                    colors: {
                        azul: { 900:'#0f1e36', 800:'#162d4d', 700:'#1d3c63', 600:'#244b7a', 500:'#2b5a91', 400:'#3269a8' },
                        gris: { 900:'#1a1a1f', 800:'#27272f', 700:'#34343f', 600:'#41414f', 500:'#5e5e6e', 400:'#7b7b8d' },
                        dorado: { 600:'#b8860b', 500:'#daa520', 400:'#e6b83a' },
                        calido: { 50:'#fff9f0', 100:'#fff3e0', 200:'#ffe8c2', 300:'#ffdca4' }
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Merriweather', serif; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .bg-hero { background: linear-gradient(180deg, #1d3c63 0%, #2b5a91 100%); }
        .dark .bg-hero { background: linear-gradient(180deg, #0f1e36 0%, #162d4d 100%); }
        .modal { display: none; }
        .modal.activo { display: flex; }
    </style>
</head>
<body class="bg-calido-50 dark:bg-gris-900 text-gris-800 dark:text-calido-100 min-h-screen transition-colors duration-300">

<!-- BARRA SUPERIOR -->
<header class="sticky top-0 z-50 bg-white/90 dark:bg-gris-800/90 backdrop-blur-sm border-b border-calido-200 dark:border-gris-700">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-2xl text-azul-700 dark:text-dorado-400">🖩</span>
            <span class="text-2xl font-semibold text-azul-800 dark:text-dorado-300">Mis Finanzas</span>
        </div>
        <div class="flex items-center gap-4">
            <button id="btn-tema" class="p-2 rounded-lg hover:bg-calido-100 dark:hover:bg-gris-700">
                <span id="icono-luz">🌙</span>
                <span id="icono-oscuro" class="hidden">☀️</span>
            </button>
        </div>
    </div>
</header>

<!-- PANTALLA PRINCIPAL -->
<div class="bg-hero text-white py-16 px-6">
    <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-normal mb-8 leading-tight">
            Claridad y control para tu economía
        </h1>
        <p class="text-xl font-light mb-12 max-w-3xl mx-auto leading-relaxed">
            Mis Finanzas te acompaña hacia la estabilidad económica. Comprendé tus hábitos, optimizá tus gastos y construí ahorros sostenibles.
        </p>
        <div class="flex flex-col gap-4 max-w-md mx-auto">
            <button id="btn-registro" class="bg-white text-azul-800 py-4 px-6 rounded-xl text-xl font-medium shadow-lg hover:shadow-xl transition-all">
                Crear cuenta gratis
            </button>
            <button id="btn-ingreso" class="border-2 border-white text-white py-4 px-6 rounded-xl text-xl font-medium hover:bg-white/10 transition-all">
                Ya tengo cuenta
            </button>
        </div>
    </div>
</div>

<!-- MODAL REGISTRO -->
<div id="modal-registro" class="modal fixed inset-0 bg-black/60 items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-gris-800 p-6 rounded-xl w-full max-w-md">
        <h3 class="text-xl font-bold mb-4">Crear tu cuenta</h3>
        <form id="form-registro" class="space-y-4">
            <input type="text" id="reg-nombre" placeholder="Nombre o alias" required class="w-full p-3 rounded-lg border border-calido-300 dark:border-gris-600 bg-calido-50 dark:bg-gris-900">
            <input type="email" id="reg-email" placeholder="Tu correo electrónico" required class="w-full p-3 rounded-lg border border-calido-300 dark:border-gris-600 bg-calido-50 dark:bg-gris-900">
            <input type="password" id="reg-pass" placeholder="Contraseña (mínimo 6 caracteres)" required minlength="6" class="w-full p-3 rounded-lg border border-calido-300 dark:border-gris-600 bg-calido-50 dark:bg-gris-900">
            <button type="submit" class="w-full py-3 rounded-lg bg-azul-600 text-white">Crear cuenta</button>
        </form>
        <button class="mt-4 text-sm text-gris-500" onclick="cerrarTodo()">Cerrar</button>
    </div>
</div>

<!-- MODAL INGRESO -->
<div id="modal-ingreso" class="modal fixed inset-0 bg-black/60 items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-gris-800 p-6 rounded-xl w-full max-w-md">
        <h3 class="text-xl font-bold mb-4">Ingresar</h3>
        <form id="form-ingreso" class="space-y-4">
            <input type="email" id="ing-email" placeholder="Tu correo" required class="w-full p-3 rounded-lg border border-calido-300 dark:border-gris-600 bg-calido-50 dark:bg-gris-900">
            <input type="password" id="ing-pass" placeholder="Contraseña" required class="w-full p-3 rounded-lg border border-calido-300 dark:border-gris-600 bg-calido-50 dark:bg-gris-900">
            <button type="submit" class="w-full py-3 rounded-lg bg-azul-600 text-white">Entrar</button>
        </form>
        <button class="mt-4 text-sm text-gris-500" onclick="cerrarTodo()">Cerrar</button>
    </div>
</div>

<script>
    // CONEXIÓN SUPABASE CORRECTA
    const SUPABASE_URL = "https://rvfwcbdroqjccxjwznkm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_09BiXr7PFlLfDP3YfEZg-w_b_5UH0td";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // CAMBIO DE TEMA FUNCIONAL
    if(localStorage.getItem('tema') === 'oscuro') {
        document.documentElement.classList.add('dark');
        document.getElementById('icono-luz').classList.add('hidden');
        document.getElementById('icono-oscuro').classList.remove('hidden');
    }
    document.getElementById('btn-tema').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        const oscuro = document.documentElement.classList.contains('dark');
        localStorage.setItem('tema', oscuro ? 'oscuro' : 'claro');
        document.getElementById('icono-luz').classList.toggle('hidden', oscuro);
        document.getElementById('icono-oscuro').classList.toggle('hidden', !oscuro);
    });

    // ABRIR Y CERRAR MODALES
    document.getElementById('btn-registro').addEventListener('click', () => {
        document.getElementById('modal-registro').classList.add('activo');
    });
    document.getElementById('btn-ingreso').addEventListener('click', () => {
        document.getElementById('modal-ingreso').classList.add('activo');
    });
    function cerrarTodo() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('activo'));
    }

    // REGISTRO REAL
    document.getElementById('form-registro').addEventListener('submit', async e => {
        e.preventDefault();
        const nombre = document.getElementById('reg-nombre').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const pass = document.getElementById('reg-pass').value;

        const { error } = await supabase.auth.signUp({
            email: email,
            password: pass,
            options: { data: { nombre: nombre } }
        });

        if(error) alert('Error: ' + error.message);
        else alert('¡Listo! Te enviamos un correo para confirmar tu cuenta ✅');
        cerrarTodo();
    });

    // INGRESO REAL
    document.getElementById('form-ingreso').addEventListener('submit', async e => {
        e.preventDefault();
        const email = document.getElementById('ing-email').value.trim();
        const pass = document.getElementById('ing-pass').value;

        const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
        if(error) alert('Error: ' + error.message);
        else alert('¡Bienvenido! ✅');
        cerrarTodo();
    });
</script>

</body>
</html>
